<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080B12"><title>PIZZLING</title>
<style>
:root{--bg:#080b12;--panel:#111827;--panel2:#172033;--blue:#2878ff;--text:#f8fafc;--muted:#93a4ba;--green:#22c55e;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding:0 0 88px}
header{padding:22px 18px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:#000;color:white;display:grid;place-items:center;font-size:28px;font-weight:900}.brand b{font-size:19px;letter-spacing:1.5px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px}
.avatar{border:1px solid #263349;background:#111827;color:white;border-radius:50%;width:40px;height:40px;font-weight:700}
main{padding:8px 16px}.hello{color:var(--muted);font-size:13px}.title{font-size:24px;font-weight:800;margin:4px 0 16px}
.balance{background:linear-gradient(135deg,#15366e,#10234a 58%,#111827);border:1px solid #28539a;border-radius:22px;padding:20px;position:relative;overflow:hidden}.balance:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;border:1px solid #ffffff18;right:-60px;top:-60px;box-shadow:0 0 0 24px #ffffff08,0 0 0 48px #ffffff05}
.balance label{color:#c5d9ff;font-size:13px}.amount{font-size:32px;font-weight:850;margin:8px 0 18px;letter-spacing:.3px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#ffffff12;padding:12px;border-radius:14px}.stat span{font-size:12px;color:#d1ddf0}.stat b{display:block;margin-top:5px;font-size:17px}.green{color:#4ade80}.red{color:#fda4af}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.action{border:0;border-radius:15px;padding:15px;color:white;font-size:15px;font-weight:750;background:var(--blue)}.action.out{background:#182338;border:1px solid #2b3b55}
.section{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}.section b{font-size:17px}.section small{color:#78aaff}
.item{background:var(--panel);border:1px solid #1d293b;border-radius:15px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.item small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.item strong{font-size:15px}.empty{text-align:center;color:var(--muted);padding:24px 8px;background:var(--panel);border-radius:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d1422;border-top:1px solid #202d41;display:flex;justify-content:space-around;padding:12px 4px calc(12px + env(safe-area-inset-bottom));z-index:4}nav button{background:none;border:0;color:#9aabc1;font-size:11px}nav b{display:block;font-size:19px;margin-bottom:3px}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:10}.sheet{background:#111827;border:1px solid #29364a;border-radius:22px 22px 0 0;padding:22px 18px 30px;width:100%}.sheet h3{margin:0 0 14px}.field{width:100%;padding:14px;margin:7px 0 12px;background:#0b1220;border:1px solid #2b3b55;border-radius:12px;color:white;font-size:16px}.wide{width:100%;padding:14px;border:0;border-radius:12px;background:var(--blue);color:white;font-weight:800;font-size:15px}.cancel{background:#263247;margin-top:9px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tool{background:#141f31;border:1px solid #29384e;color:#fff;border-radius:14px;padding:16px;text-align:left}.tool span{display:block;color:var(--muted);font-size:11px;margin-top:5px}
</style></head><body>
<header><div class="brand"><div class="logo">P</div><div><b>PIZZLING</b><small>PERSONAL FINANCE</small></div></div><button class="avatar" onclick="show('settings')">P</button></header>
<main id="home"><div class="hello">স্বাগতম 👋</div><div class="title">আপনার হিসাব</div>
<section class="balance"><label>মোট ব্যালেন্স</label><div class="amount" id="balance">৳ ০</div><div class="stats"><div class="stat"><span>মোট আয়</span><b class="green" id="income">৳ ০</b></div><div class="stat"><span>মোট ব্যয়</span><b class="red" id="expense">৳ ০</b></div></div></section>
<div class="actions"><button class="action" onclick="openForm('income')">＋ আয় যোগ</button><button class="action out" onclick="openForm('expense')">－ ব্যয় যোগ</button></div>
<div class="section"><b>সাম্প্রতিক লেনদেন</b><small onclick="show('history')">সব দেখুন</small></div><div id="recent"></div></main>
<main id="history" style="display:none"><div class="title">লেনদেনের ইতিহাস</div><div id="all"></div></main>
<main id="settings" style="display:none"><div class="title">সেটিংস</div><div class="tools">
<button class="tool" onclick="document.getElementById('updateFile').click()">↻ HTML আপডেট<span>নতুন .html ফাইল ইমপোর্ট</span></button>
<button class="tool" onclick="backup()">☁ ব্যাকআপ<span>JSON ফাইল ডাউনলোড</span></button>
<button class="tool" onclick="document.getElementById('restoreFile').click()">↥ Restore<span>ব্যাকআপ ফাইল ফিরিয়ে আনুন</span></button>
<button class="tool" onclick="alert('Google Drive ব্যাকআপ পরের ধাপে যুক্ত হবে।')">Google Drive<span>ক্লাউড ব্যাকআপ সংযোগ</span></button>
</div><input id="updateFile" type="file" accept=".html,text/html" hidden onchange="installUpdate(event)"><input id="restoreFile" type="file" accept=".json,application/json" hidden onchange="restore(event)"><p style="color:#93a4ba;font-size:12px;margin-top:18px">PIZZLING v1.0.0 · আপনার তথ্য এই ফোনে সংরক্ষিত থাকে।</p></main>
<nav><button onclick="show('home')"><b>⌂</b>হোম</button><button onclick="show('history')"><b>▤</b>ইতিহাস</button><button onclick="show('settings')"><b>⚙</b>সেটিংস</button></nav>
<div class="overlay" id="modal"><div class="sheet"><h3 id="formTitle">লেনদেন যোগ করুন</h3><input id="desc" class="field" placeholder="বিবরণ লিখুন"><input id="money" class="field" type="number" inputmode="decimal" placeholder="টাকার পরিমাণ"><button class="wide" onclick="saveTx()">সংরক্ষণ করুন</button><button class="wide cancel" onclick="closeForm()">বাতিল</button></div></div>
<script>
const KEY='pizzling_transactions_v1';let tx=JSON.parse(localStorage.getItem(KEY)||'[]'),kind='income';
const money=n=>'৳ '+Number(n||0).toLocaleString('bn-BD');
function persist(){localStorage.setItem(KEY,JSON.stringify(tx));render()}
function render(){let inc=tx.filter(x=>x.kind==='income').reduce((a,x)=>a+x.amount,0),out=tx.filter(x=>x.kind==='expense').reduce((a,x)=>a+x.amount,0);document.getElementById('balance').textContent=money(inc-out);document.getElementById('income').textContent=money(inc);document.getElementById('expense').textContent=money(out);let html=tx.slice().reverse().map(x=>`<div class="item"><div><strong>${esc(x.desc)}</strong><small>${x.date}</small></div><strong class="${x.kind==='income'?'green':'red'}">${x.kind==='income'?'+':'−'} ${money(x.amount)}</strong></div>`).join('')||'<div class="empty">এখনো কোনো লেনদেন যোগ করা হয়নি</div>';document.getElementById('recent').innerHTML=html;document.getElementById('all').innerHTML=html}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(id){['home','history','settings'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none')}
function openForm(k){kind=k;document.getElementById('formTitle').textContent=k==='income'?'আয় যোগ করুন':'ব্যয় যোগ করুন';document.getElementById('modal').style.display='flex'}
function closeForm(){document.getElementById('modal').style.display='none'}
function saveTx(){let d=document.getElementById('desc').value.trim(),a=Number(document.getElementById('money').value);if(!d||!a||a<0){alert('বিবরণ ও সঠিক টাকার পরিমাণ দিন');return}tx.push({kind,desc:d,amount:a,date:new Date().toLocaleString('bn-BD')});document.getElementById('desc').value='';document.getElementById('money').value='';closeForm();persist()}
function backup(){let b=new Blob([JSON.stringify({app:'PIZZLING',version:1,transactions:tx},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pizzling-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.transactions))throw 0;if(!confirm('বর্তমান হিসাবের জায়গায় ব্যাকআপের হিসাব বসবে। চালাবেন?'))return;tx=d.transactions;persist();alert('ব্যাকআপ Restore হয়েছে')}catch(_){alert('ভুল ব্যাকআপ ফাইল')}};r.readAsText(f);e.target.value=''}
function installUpdate(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let html=String(r.result);if(!/<html[\s>]/i.test(html)){alert('সঠিক HTML ফাইল নয়');return}if(!confirm('নতুন HTML ইনস্টল হবে। হিসাবের ডেটা থাকবে। চালাবেন?'))return;if(window.PizzlingNative&&PizzlingNative.installUpdate)PizzlingNative.installUpdate(html);else{localStorage.setItem('pizzling_pending_html',html);alert('ব্রাউজার প্রিভিউতে HTML সংরক্ষিত হয়েছে; APK-তে ইনস্টল হবে।')}};r.readAsText(f);e.target.value=''}
render();
</script></body></html>
